# Publishes the trustbeat npm package on a version tag.
#
# This workflow lives at the root of TrustBeat/sdk-typescript (mirrored from
# eu-security-app sdk/typescript). It does NOT run in the monorepo.
#
# Auth: npm trusted publishing (OIDC, id-token: write) — no token. Configured on
# npmjs.com (package trustbeat → Settings → Trusted Publisher: TrustBeat/sdk-typescript,
# publish.yml, allowed action "publish"). Needs npm >= 11.5.1 and Node >= 22.14.
# The former NPM_TOKEN secret expired (90-day limit) and failed the 0.6.0 publish.
# Provenance is attached automatically — requires a public repo.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # npm trusted publishing + provenance
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing silently falls back to (missing) token auth on an older npm.
      - name: Check npm supports trusted publishing
        run: |
          v=$(npm --version); echo "npm $v"
          [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -1)" = 11.5.1 ] || { echo "::error::npm $v < 11.5.1"; exit 1; }

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag pkg=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != package.json version $pkg"; exit 1; }

      - run: npm install

      - run: npm run build

      - run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public

      # Dogfood: qualified timestamp for the release tarball (npm pack in the
      # same run produces the same bytes npm publish uploaded).
      # Evidence step only — must never turn a completed publish red.
      - name: Pack tarball for anchoring
        run: npm pack

      - name: Anchor release artifact (TrustBeat)
        continue-on-error: true
        uses: TrustBeat/anchor-action@a5eb4451717f36d7bd1b6142a473003031f27512  # v1.0.0
        with:
          api-key: ${{ secrets.TRUSTBEAT_API_KEY }}
          files: '*.tgz'
          description: "trustbeat npm ${{ github.ref_name }}"
